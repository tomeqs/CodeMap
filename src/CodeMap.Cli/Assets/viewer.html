  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="labels"></div>

      <header id="topbar">
        <div class="brand">
          <span class="logo"></span>
          <span class="title">CodeMap</span>
          <span id="source-name" class="muted"></span>
        </div>
        <div class="seg" id="view-toggle" title="View (G / C)">
          <button data-view="galaxy" class="active">Galaxy</button>
          <button data-view="city">City</button>
        </div>
        <div class="seg" id="level-toggle" title="Level of detail (1-4)">
          <button data-level="project">Projects</button>
          <button data-level="namespace">Namespaces</button>
          <button data-level="type" class="active">Types</button>
          <button data-level="member">Members</button>
        </div>
        <div class="search">
          <input id="search" type="search" placeholder="Search types, members, files…  ( / )" autocomplete="off" spellcheck="false" />
          <div id="search-results" class="dropdown hidden"></div>
        </div>
        <div class="actions">
          <button id="btn-fit" title="Fit view (F)">⤢</button>
          <button id="btn-open" title="Open a .codemap.json file">Open…</button>
          <input id="file-input" type="file" accept=".json,application/json" hidden />
        </div>
      </header>

      <nav id="breadcrumb" class="hidden"></nav>

      <aside id="left" class="panel">
        <div class="tabs">
          <button data-tab="filters" class="active">Filters</button>
          <button data-tab="insights">Insights</button>
          <button data-tab="about">Data</button>
        </div>
        <div class="tab-body" id="tab-filters"></div>
        <div class="tab-body hidden" id="tab-insights"></div>
        <div class="tab-body hidden" id="tab-about"></div>
      </aside>
      <button id="left-toggle" class="panel-toggle" title="Toggle panel">⟨</button>

      <aside id="right" class="panel hidden"></aside>

      <div id="legend"></div>
      <div id="hud"></div>
      <div id="tooltip" class="hidden"></div>

      <div id="welcome" class="hidden">
        <div class="welcome-card">
          <div class="logo big"></div>
          <h1>CodeMap</h1>
          <p>Drop a <code>.codemap.json</code> file here, or</p>
          <button id="welcome-open" class="primary">Choose a file…</button>
          <p class="muted small">Generate one with <code>codemap path/to/Solution.sln</code></p>
        </div>
      </div>
      <div id="drop-overlay" class="hidden"><div>Drop the CodeMap JSON to load it</div></div>
    </div>

    <script id="codemap-data" type="application/json">null</script>
  </body>
</html>
