# Tests on every push: the analyzer, the viewer (smoke tests in headless Chromium) and the VS Code extension (unit tests and a real VS Code under Xvfb).
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analyzers/typescript/package-lock.json
      - name: TypeScript plugin (the .NET tests run it)
        run: npm ci --prefix analyzers/typescript
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet test -c Release
        env:
          CODEMAP_REQUIRE_NODE: '1'
          CODEMAP_REQUIRE_PYTHON: '1'
      - name: codemap mcp in its own process (stdout only for the protocol)
        timeout-minutes: 15
        run: |
          dotnet build src/CodeMap.Cli -c Release --no-restore -v q
          node tests/mcp-smoke.mjs dotnet src/CodeMap.Cli/bin/Release/net8.0/codemap.dll

  # The TypeScript / JavaScript language plugin on the Node versions it supports.
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: analyzers/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: analyzers/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  # The Python language plugin on the oldest and newest Pythons it supports, and on Windows (paths, the py launcher).
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.9' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.12' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: analyzers/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s test -v

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Chromium for the smoke tests
        run: npx playwright install --with-deps chromium
      - name: TypeScript plugin (the analyzer maps samples/shop-ts with it)
        run: npm ci --prefix ../analyzers/typescript
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sample graphs for the smoke tests (the analyzer on samples/Shop, samples/shop-ts, samples/shop-py and samples/ as a whole)
        run: |
          dotnet build ../src/CodeMap.Cli -c Release -v quiet
          codemap() { dotnet ../src/CodeMap.Cli/bin/Release/net8.0/codemap.dll "$@" -f json --no-git -q; }
          codemap ../samples/Shop/Shop.sln -o "$RUNNER_TEMP/shop"
          mkdir -p public && cp "$RUNNER_TEMP/shop/Shop.codemap.json" public/sample.codemap.json
          codemap ../samples/shop-ts -o "$RUNNER_TEMP/samples"
          codemap ../samples/shop-py -o "$RUNNER_TEMP/samples"
          codemap ../samples -o "$RUNNER_TEMP/samples"
          ls "$RUNNER_TEMP/samples"
      - run: npm run build
      - name: The call flows the C# port is tested against match flow.js (codemap mcp's call_flow = the Flow view)
        run: |
          for map in shop booking shop-py; do
            node ../tests/CodeMap.Tests/Golden/flows.mjs ../tests/CodeMap.Tests/Golden/$map.codemap.json | diff - ../tests/CodeMap.Tests/Golden/$map.flows.txt
          done
      - name: The viewer built into the CLI matches the sources
        run: git diff --exit-code --stat -- ../src/CodeMap.Cli/Assets/viewer.html
      - name: Smoke tests on WebGPU and WebGL 2 (headless Chromium without a GPU)
        run: npm run test:smoke -- --renderers webgpu,webgl --samples "$RUNNER_TEMP/samples"

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle the analyzer and the viewer
        run: npm run prepare-assets
      - name: Unit tests
        run: npm test
      - name: Integration tests in VS Code
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npx vsce package --no-dependencies -o codemap.vsix
