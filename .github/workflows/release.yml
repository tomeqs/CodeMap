# Builds the standalone executables (Windows, Linux, macOS), the dotnet tool package and the VS Code extension.
# Push a tag such as v0.2.0 (or run it by hand with a version) to publish a GitHub release;
# run it by hand without a version to just get the files as artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (creates the tag v0.2.0 on this commit). Empty: build only.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test -c Release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, smoke: true }
          - { rid: win-arm64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest, smoke: true }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest, smoke: true }
          # Intel macOS needs no code signature, so it cross-compiles on Linux (no wait for a macOS runner).
          - { rid: osx-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then v="${INPUT_VERSION#v}"
          else v="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::Not a version: $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" || -n "$INPUT_VERSION" ]]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish single-file executable
        run: dotnet publish src/CodeMap.Cli -c Release -r ${{ matrix.rid }} -p:Version=${{ steps.version.outputs.version }} -p:DebugType=none -o publish

      - name: Smoke test
        if: matrix.smoke
        run: |
          exe=./publish/codemap${{ runner.os == 'Windows' && '.exe' || '' }}
          "$exe" --version
          "$exe" samples/Shop/Shop.sln -o smoke -f json,html -q
          test -s smoke/Shop.codemap.json
          test -s smoke/Shop.html

      - name: Archive
        run: |
          name="codemap-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          cd publish
          if [[ "${{ matrix.rid }}" == win-* ]]; then 7z a -tzip "../$name.zip" codemap.exe; else tar -czf "../$name.tar.gz" codemap; fi

      - uses: actions/upload-artifact@v4
        with:
          name: codemap-${{ matrix.rid }}
          path: |
            codemap-*.zip
            codemap-*.tar.gz
          if-no-files-found: error

  vscode:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then v="${INPUT_VERSION#v}"
          else v="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::Not a version: $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Set the extension version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Package the extension
        run: |
          npm run prepare-assets
          npm test
          npx vsce package --no-dependencies --skip-license -o "../codemap-${{ steps.version.outputs.version }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: codemap-vscode
          path: codemap-*.vsix
          if-no-files-found: error

  release:
    needs: [build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then v="${INPUT_VERSION#v}"
          else v="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::Not a version: $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" || -n "$INPUT_VERSION" ]]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

      - name: Pack dotnet tool
        run: dotnet pack src/CodeMap.Cli -c Release -p:Version=${{ steps.version.outputs.version }} -o dist

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: codemap-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CodeMap ${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      - name: Keep the files (build-only run)
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codemap-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish the dotnet tool to NuGet
        if: steps.version.outputs.release == 'true' && env.NUGET_API_KEY != ''
        run: dotnet nuget push "dist/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish the extension to the VS Code Marketplace
        if: steps.version.outputs.release == 'true' && env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath dist/*.vsix --skip-duplicate

      - name: Publish the extension to Open VSX (VSCodium, Cursor…)
        if: steps.version.outputs.release == 'true' && env.OVSX_PAT != ''
        run: npx --yes ovsx@1.2.0 publish dist/*.vsix --skip-duplicate
